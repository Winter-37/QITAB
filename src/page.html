<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theory Notebook</title>
<style>
/*@offline-fonts*/
@font-face{font-family:"Literata";font-style:normal;font-weight:200 900;src:url(vendor/fonts/literata-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Literata";font-style:italic;font-weight:200 900;src:url(vendor/fonts/literata-latin-wght-italic.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(vendor/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(vendor/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-weight:500;src:url(vendor/fonts/ibm-plex-sans-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-weight:600;src:url(vendor/fonts/ibm-plex-sans-condensed-latin-600-normal.woff2) format("woff2")}
/*@end-offline-fonts*/

/* Layout: folder tree on the left (a slide-out drawer on phones), one reading column on the right.
   To change fonts, edit the three --display / --serif / --mono lines below. */
:root{
  --bg:#F2F5F6;
  --surface:#FFFFFF;
  --fg:#16222B;
  --muted:#58697A;
  --line:#D2DBE1;
  --accent:#0B7A85;
  --accent-ink:#065058;
  --accent-wash:#E0F0F1;
  --code:#E8EEF1;
  --scrim:rgba(14,23,29,.45);--warn:#9A5B00;
  /* topic graph: one fixed colour per part (by folder number), so a part keeps its colour as others fill.
     Eight validated categorical hues; parts 01 and 07 (no sections yet) share the muted grey. */
  --part-00:#eda100;--part-01:#58697A;--part-02:#eb6834;--part-03:#e87ba4;--part-04:#2a78d6;
  --part-05:#6250d6;--part-06:#1baf7a;--part-07:#58697A;--part-08:#e34948;--part-09:#008300;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E171D;--surface:#14212A;--fg:#E3EAEE;--muted:#94A6B3;--line:#27373F;
    --accent:#58C4CE;--accent-ink:#8FDDE4;--accent-wash:#12303A;--code:#1A2A33;--scrim:rgba(0,0,0,.6);--warn:#E3A857;
    --part-00:#c98500;--part-01:#94A6B3;--part-02:#d95926;--part-03:#d55181;--part-04:#3987e5;
    --part-05:#9085e9;--part-06:#199e70;--part-07:#94A6B3;--part-08:#e66767;--part-09:#0ca30c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171D;--surface:#14212A;--fg:#E3EAEE;--muted:#94A6B3;--line:#27373F;
  --accent:#58C4CE;--accent-ink:#8FDDE4;--accent-wash:#12303A;--code:#1A2A33;--scrim:rgba(0,0,0,.6);--warn:#E3A857;
  --part-00:#c98500;--part-01:#94A6B3;--part-02:#d95926;--part-03:#d55181;--part-04:#3987e5;
  --part-05:#9085e9;--part-06:#199e70;--part-07:#94A6B3;--part-08:#e66767;--part-09:#0ca30c;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:17px;line-height:1.7}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;margin:0 auto 0 0;white-space:nowrap}
.mark a{color:inherit;text-decoration:none}
.btn{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px solid var(--line);padding:7px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
#menu{display:none}
@media (max-width:480px){.mark{font-size:.9rem;letter-spacing:.08em}.btn{padding:7px 9px}.top{gap:8px}}

/* two-column shell */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0 56px;padding-top:28px}
.main{min-width:0}
@media (min-width:900px){
  .layout{grid-template-columns:300px minmax(0,1fr)}
  .side{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:8px}
  #close{display:none}
}
@media (max-width:899px){
  #menu{display:inline-block}
  .side{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(88vw,360px);background:var(--bg);border-right:1px solid var(--line);overflow:auto;
        padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
        transform:translateX(-102%);visibility:hidden}
  .side.open{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;z-index:20;background:var(--scrim)}
}
@media (prefers-reduced-motion:no-preference){
  .side{transition:transform .2s ease,visibility .2s}
  .nl,.item .t,.btn,.tg::before{transition:color .15s,background .15s,border-color .15s,transform .15s}
}

/* sidebar tree */
.side h2{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:11px;padding-left:6px;border-left:1px solid var(--line)}
.tree li.collapsed>ul{display:none}
.row{display:flex;align-items:flex-start}
.tg{flex:none;width:24px;height:31px;background:none;border:0;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.tg::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg)}
li:not(.collapsed)>.row>.tg::before{transform:rotate(45deg)}
.tg:hover{color:var(--accent-ink)}
.tg.none{pointer-events:none;cursor:default}
.tg.none::before{display:none}
.nl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;padding:5px 6px;font-family:var(--display);font-weight:500;font-size:.95rem;line-height:1.3;color:var(--fg);text-decoration:none}
.nl .nn{flex:none;font-family:var(--mono);font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nl .nt{flex:1;min-width:0;overflow-wrap:anywhere}
.nl .ct{flex:none;font-family:var(--mono);font-size:.68rem;color:var(--accent-ink)}
.nl:hover{background:var(--accent-wash)}
.nl.cur{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.tree>li>.row>.nl{font-weight:600}

/* search */
.searchbar{max-width:760px}
.search{width:100%;font-family:var(--mono);font-size:.9rem;padding:11px 14px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:0}
.search::placeholder{color:var(--muted)}

/* folder and results views */
.crumbs{display:flex;flex-wrap:wrap;gap:2px 8px;margin:24px 0 18px;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.crumbs a{color:var(--accent-ink);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{opacity:.5}
.head{max-width:760px}
.eyebrow{margin:0 0 6px;font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.head h1{font-family:var(--display);font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.08;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
.lede{max-width:60ch;margin:0 0 10px}
.sub{margin:0;font-family:var(--mono);font-size:.78rem;color:var(--muted);line-height:1.6}
.group{max-width:760px;margin-top:36px}
.group>h2{margin:0 0 6px;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0}
.items li{border-top:1px solid var(--line)}
.items li:last-child{border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(48px,max-content) minmax(0,1fr);gap:4px 14px;padding:14px 0;color:inherit;text-decoration:none}
.item.nonum,.item.note{grid-template-columns:minmax(0,1fr)}
.item.note{padding:18px 0}
.item.note.numd{grid-template-columns:minmax(48px,max-content) minmax(0,1fr)}
.item .no{font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.item .t{display:block;font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.25;text-wrap:balance}
.item .s{display:block;max-width:58ch;font-size:.95rem;margin-top:3px}
.item .m{display:block;margin-top:5px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.item:hover .t{color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.item:hover .no{color:var(--accent)}
.empty{max-width:760px;margin-top:36px;padding:20px;border:1px dashed var(--line)}
.empty p{margin:0 0 12px}
.empty p:last-child{margin-bottom:0}
.pathbox{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.pathbox code{flex:1 1 280px;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--code);padding:9px 12px;font-family:var(--mono);font-size:.78rem}
.none-found{max-width:760px;margin-top:28px;color:var(--muted)}

/* note view */
.note-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
@media (min-width:1400px){.note-grid{grid-template-columns:minmax(0,690px) 200px}}
.post-head h1{font-family:var(--display);font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 14px;text-wrap:balance}
.post-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 10px;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.also{margin:0 0 30px;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.also a{color:var(--accent-ink)}
.post-body{min-width:0;max-width:690px}
/* paragraphs scroll sideways only if a long inline formula cannot fit; padding keeps sub/superscripts from clipping */
.post-body p,.post-body li{overflow-x:auto;overflow-y:hidden;padding-block:.3em}
.post-body ol,.post-body ul{list-style:none}
.post-body ol{counter-reset:li}
.post-body ol>li{counter-increment:li}
.post-body ol>li,.post-body ul>li{position:relative;padding-left:1.5em}
.post-body ol>li::before{content:counter(li) ".";position:absolute;left:0;top:.3em;color:var(--accent);font-variant-numeric:tabular-nums}
.post-body ul>li::before{content:"\2022";position:absolute;left:.35em;top:.3em;color:var(--accent)}
.post-body p{margin:-.3em 0 .75em}
.post-body h2{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1.2;margin:2.1em 0 .6em;text-wrap:balance;scroll-margin-top:16px}
.post-body h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 .6em}
.post-body ul,.post-body ol{margin:0 0 1.1em;padding-left:0}
.post-body li{margin:-.3em 0 .15em}
.post-body li::marker{color:var(--accent)}
.post-body code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:1px 5px}
.eq{margin:1.1em 0;overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container{color:inherit}
mjx-container[display="true"]{display:block;overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.9em 0}
.example{background:var(--surface);border:1px solid var(--line);padding:22px clamp(16px,3vw,28px);margin:2.2em 0}
.example .label{margin:0 0 10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.example>:last-child{margin-bottom:0}
.tablewrap{overflow-x:auto;margin:1.1em 0}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 14px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;padding-right:18px;white-space:nowrap}
.refs{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:2.6em}
.refs p{margin:0 0 .4em}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px;max-width:690px}
.pager button{display:block;text-align:left;background:transparent;border:1px solid var(--line);padding:14px 16px;cursor:pointer}
.pager button:hover{border-color:var(--accent)}
.pager .dir{display:block;margin-bottom:4px;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager .nt{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.25}
.pager .next{grid-column:2;text-align:right}
.rail{display:none}
@media (min-width:1400px){
  .rail{display:block;position:sticky;top:24px;align-self:start}
  .rail h4{margin:0 0 12px;font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .rail ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  .rail li a{display:block;padding:6px 0 6px 14px;font-family:var(--display);font-weight:500;font-size:.95rem;line-height:1.3;color:var(--muted);text-decoration:none;cursor:pointer}
  .rail li a:hover{color:var(--accent-ink)}
}
@media (max-width:520px){
  .item{grid-template-columns:minmax(40px,max-content) minmax(0,1fr);gap:4px 10px}
  .item.nonum,.item.note{grid-template-columns:minmax(0,1fr)}
  .item.note.numd{grid-template-columns:minmax(40px,max-content) minmax(0,1fr)}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:1}
  .pager.top{grid-template-columns:1fr 1fr;gap:8px}
  .pager.top .next{grid-column:2}
  .pager.top .nt{font-size:.82rem}
}

/* ---- additions: Markdown content, cross-links, dashboard ---- */
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.post-body pre{background:var(--code);padding:14px 16px;overflow-x:auto;margin:1.1em 0;font-family:var(--mono);font-size:.84rem;line-height:1.55;max-width:100%}
.post-body pre code{background:none;padding:0;font-size:inherit}
.post-body img{max-width:100%;height:auto}
.post-body blockquote{margin:1.1em 0;padding:.1em 0 .1em 1em;border-left:2px solid var(--line);color:var(--muted)}
.post-body blockquote p{margin-bottom:.5em}
.post-body a.xref{text-decoration-thickness:1px;text-underline-offset:3px}
.planned{color:var(--muted);border-bottom:1px dashed var(--muted);cursor:help}
.post-body .admonition{background:var(--surface);border:1px solid var(--line);padding:18px clamp(16px,3vw,26px);margin:2em 0}
.post-body .admonition>:last-child{margin-bottom:0}
.post-body .admonition>.admonition-title{margin:0 0 10px;padding:0;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.post-body .admonition.warning,.post-body .admonition.danger{border-color:var(--warn)}
.post-body .admonition.warning>.admonition-title,.post-body .admonition.danger>.admonition-title{color:var(--warn)}

.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.s-complete{border-color:var(--accent);color:var(--accent-ink)}
.badge.s-needs-revision{border-color:var(--warn);color:var(--warn)}
.badge.s-in-progress{color:var(--fg)}
.cite{margin:0 0 10px;font-family:var(--mono);font-size:.76rem;color:var(--muted);line-height:1.6}
.cite a{color:var(--accent-ink)}

.xrefs{max-width:690px;margin:28px 0 0}
.xrefs.pre{margin:0 0 30px}
.xrefs h3{margin:0 0 6px;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.xrefs ul{list-style:none;margin:0;padding:0}
.xrefs li{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.xrefs li:last-child{border-bottom:1px solid var(--line)}
.xrefs a{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.3;color:var(--fg);text-decoration:none}
.xrefs a:hover{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.xrefs .planned{font-family:var(--display);font-weight:500;font-size:1.05rem}
.xrefs .m{font-family:var(--mono);font-size:.7rem;color:var(--muted)}

.tree .secs{margin-left:30px;border-left:1px dotted var(--line)}
.nl.sl{font-family:var(--serif);font-weight:400;font-size:.84rem;padding:3px 6px;color:var(--muted)}
.nl.sl .nn{font-size:.62rem}
.nl.sl.cur{color:var(--accent-ink);font-weight:600}
.nl.nl-empty .nt{color:var(--muted);font-weight:500}
.eyebrow a{color:inherit;text-decoration:none}
.eyebrow a:hover{text-decoration:underline}
.pager.top{margin:0 0 26px;grid-template-columns:1fr 1fr}
.pager.top button{padding:8px 12px}
.pager.top .nt{font-size:.92rem}
.pager .ch{display:block;margin-top:3px;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
.cta .chip{font-size:.8rem;padding:9px 14px}
.cta .chip.primary{border-color:var(--accent);color:var(--accent-ink)}
.stats{margin:0;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.head.home{margin-top:24px}
.group.wide{max-width:none}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 40px}
.grid li{border-top:1px solid var(--line)}
.sec{display:grid;grid-template-columns:minmax(44px,max-content) minmax(0,1fr);gap:2px 12px;padding:16px 0 20px;color:inherit;text-decoration:none}
.sec .no{font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.sec .t{display:block;font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.25;text-wrap:balance}
.sec .m{display:block;margin-top:4px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.sec .pv{display:block;margin-top:8px;font-size:.84rem;line-height:1.45;color:var(--muted)}
.sec:hover .t{color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.sec:hover .no{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.76rem;padding:6px 12px;border:1px solid var(--line);color:var(--fg);text-decoration:none;background:transparent;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip .c{color:var(--muted);margin-left:6px}
.intro{margin-top:28px}
details.add{max-width:760px;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
details.add summary{cursor:pointer;font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.add[open] summary{margin-bottom:12px}
details.add p{margin:0 0 12px;font-size:.92rem}
details.add code.inline{font-family:var(--mono);font-size:.84em;background:var(--code);padding:1px 5px}

/* ---- topic graph: the map page (#map) and the graph panel on note pages ---- */
a.btn{text-decoration:none;display:inline-block;line-height:inherit}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash)}
.btn:disabled{opacity:.45;cursor:default}
details.gmap{max-width:690px;margin:0 0 30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
details.gmap>summary{cursor:pointer;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

<script>
(function(){
  'use strict';

  function $(id){return document.getElementById(id)}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function plural(n,w){return n+' '+w+(n===1?'':'s')}
  function plain(e){return !(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0)}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  var SITE='Scientific Knowledge';
  var DATA=JSON.parse($('site-data').textContent);

  var STATUS={'not-started':'Not started','in-progress':'In progress','complete':'Complete','needs-revision':'Needs revision'};
  var KIND={theory:'Theory',derivation:'Derivation',algorithm:'Algorithm',implementation:'Implementation',comparison:'Comparison',paper:'Paper',reference:'Reference'};
  var KINDS={theory:'Theory',derivation:'Derivations',algorithm:'Algorithms',implementation:'Implementations',comparison:'Method comparisons',paper:'Papers',reference:'Reference'};
  var KIND_ORDER=['theory','derivation','algorithm','implementation','comparison','paper','reference'];
  function kindName(k){return KIND[k]||cap(k)}
  function kindsName(k){return KINDS[k]||cap(k)}

  /* ---------- folder names ---------- */
  var FIX=[[/Schrodinger/g,'Schrödinger'],[/Hartree Fock/g,'Hartree–Fock'],[/Born Oppenheimer/g,'Born–Oppenheimer'],
           [/CCSD T/g,'CCSD(T)'],[/Meta GGA/g,'Meta-GGA'],[/DMRG SCF/g,'DMRG-SCF'],[/Z Vector/g,'Z-Vector']];
  function nameParts(seg){
    var m=/^(\d+)_(.*)$/.exec(seg);

    FIX.forEach(function(f){label=label.replace(f[0],f[1])});
    return {num:m?m[1]:'',label:label};
  }

  /* ---------- tree and notes ---------- */
  var rootNode={key:'',seg:'',num:'',full:'',depth:0,label:SITE,children:[],notes:[],list:[],parent:null,intro:''};
  var byKey={'':rootNode},allNodes=[];
  function addPath(segs){
    var node=rootNode;
    segs.forEach(function(seg){
      var key=node.key?node.key+'/'+seg:seg;
      var c=byKey[key];
      if(!c){
        var p=nameParts(seg);
        var nn=p.num?String(parseInt(p.num,10)):'';
        var full=nn?(node.full?node.full+'.'+nn:nn):'';
        if(nn&&node.key&&!node.full)full='';
        c={key:key,seg:seg,num:full,full:full,depth:node.depth+1,label:p.label,children:[],notes:[],list:[],parent:node,intro:''};
        node.children.push(c);byKey[key]=c;allNodes.push(c);
      }
      node=c;
    });
    return node;
  }
  DATA.folders.forEach(function(k){addPath(k.split('/'))});

  var notes=DATA.notes,noteById={},byKind={};
  notes.forEach(function(n){
    noteById[n.id]=n;
    n.tags=n.tags||[];n.prereq=n.prereq||[];n.related=n.related||[];n.links=n.links||[];n.cite=n.cite||{};
    n.eqs=n.eqs||[];n.conv=n.conv||[];n.eqIndex={};
    n.eqs.forEach(function(e,i){n.eqIndex[e[0]]=i});
    n.node=addPath(n.home?n.home.split('/'):[]);
    n.node.notes.push(n);
    if(n.kind)(byKind[n.kind]=byKind[n.kind]||[]).push(n);
  });
  Object.keys(DATA.intros||{}).forEach(function(k){var nd=byKey[k];if(nd)nd.intro=DATA.intros[k]});

  function byOrder(a,b){
    var ao=a.order==null?1e9:a.order,bo=b.order==null?1e9:b.order;
    return ao-bo||a.title.localeCompare(b.title);
  }
  /* reading order: depth-first through the tree, notes of a folder before its subfolders */
  var reading=[],foldersAt={};
  function collect(node){
    node.notes.sort(byOrder);
    node.list=node.notes;
    node.first=reading.length;
    node.notes.forEach(function(n,i){
      n.sec=node.full?node.full+'.'+(i+1):'';
      n.seq=reading.length;reading.push(n);
    });
    if(node.key)(foldersAt[node.depth]=foldersAt[node.depth]||[]).push(node);
    node.children.forEach(collect);
    node.count=reading.length-node.first;
    node.start=node.count?reading[node.first]:null;
  }
  collect(rootNode);
  function levelName(node){return node.depth===1?'Part':(node.depth===2?'Chapter':'Section')}
  function chapterOf(n){return n.node}

  /* reverse links */
  var requiredBy={},mentionedIn={};
  function push(map,k,n){(map[k]=map[k]||[]).push(n)}
  notes.forEach(function(n){
    n.prereq.forEach(function(r){if(noteById[r]&&r!==n.id)push(requiredBy,r,n)});
    n.related.concat(n.links).forEach(function(r){if(noteById[r]&&r!==n.id)push(mentionedIn,r,n)});
  });

  /* ---------- numbered equations ----------
     build.py turns \label{x} into \tag{@@EQ:x@@} and [[note#x]] into "Eq. (@@EQREF:note~x@@)";
     the number is the section number plus the equation's position among the note's labelled ones. */
  var CONV=DATA.conventions||{axes:{},values:{}};
  function eqNum(n,lab){var i=n?n.eqIndex[lab]:null;return i==null?'?':(n.sec?n.sec+'.':'')+(i+1)}
  function fillEq(s,n){
    return String(s||'').replace(/@@EQ:([a-z0-9_-]+)@@/g,function(m,l){return eqNum(n,l)})
      .replace(/@@EQREF:([a-z0-9-]+)~([a-z0-9_-]+)@@/g,function(m,id,l){return eqNum(noteById[id],l)});
  }
  function eqTex(n,lab){for(var i=0;i<n.eqs.length;i++)if(n.eqs[i][0]===lab)return n.eqs[i][1];return ''}

  var textCache={};
  function textOf(n){
    if(textCache[n.id]==null){var d=document.createElement('div');d.innerHTML=fillEq(n.html,n);textCache[n.id]=d.textContent.replace(/\s+/g,' ')}
    return textCache[n.id];
  }

  function hashFor(key){return key.split('/').join('~')}
  function pathLabel(node){
    var parts=[];
    for(var n=node;n&&n.key;n=n.parent)parts.unshift(n.label);
    return parts.join(' / ');
  }

  /* ---------- routing ---------- */
  var state={h:'',q:''};
  function resolve(h){
    if(h.indexOf('n.')===0){
      var rest=h.slice(2),cut=rest.indexOf('~'),n=noteById[cut<0?rest:rest.slice(0,cut)];
      if(n)return {kind:'note',note:n,anchor:cut<0?'':rest.slice(cut+1)};
    }
    if(h==='sources')return {kind:'sources'};
    if(h.indexOf('k.')===0){var k=h.slice(2);if(byKind[k])return {kind:'kind',k:k}}
    if(h==='map'||h.indexOf('map.')===0)return {kind:'map',focus:noteById[h.slice(4)]||null};
    return {kind:'folder',node:byKey[h.split('~').join('/')]||rootNode};
  }
  function curNode(r){return r.kind==='folder'?r.node:(r.kind==='note'?r.note.node:null)}
  function go(h){
    try{if(location.hash.slice(1)!==h)location.hash=h}catch(e){}
    setRoute(h);
  }
  function setRoute(h){
    state.h=h;state.q='';$('q').value='';
    hidePop();syncTree();draw();closeDrawer();
    var r=resolve(h);
    if(r.anchor)jumpTo(r.anchor);else window.scrollTo(0,0);
  }
  /* bring an equation (id "eq-<label>") into view and mark it */
  function jumpTo(id){
    var e=document.getElementById(id);if(!e)return;
    var old=document.querySelector('.eq.hit');if(old&&old!==e)old.classList.remove('hit');

  window.addEventListener('hashchange',function(){
    var h=location.hash.slice(1);
    if(h!==state.h)setRoute(h);
  });

  /* ---------- sidebar ---------- */
  var liByKey={},linkByKey={},linkByNote={};
  function buildTree(node,ul){
    node.children.forEach(function(c){
      var li=el('li');liByKey[c.key]=li;
      var row=el('div','row');
      var tg;
      var hasSub=c.children.length||c.notes.length;

      var a=el('a','nl'+(c.count?'':' nl-empty'));a.href='#'+hashFor(c.key);linkByKey[c.key]=a;
      if(c.num)a.appendChild(el('span','nn',c.num));
      a.appendChild(el('span','nt',c.label));
      if(c.count)a.appendChild(el('span','ct',String(c.count)));
      a.addEventListener('click',function(e){if(plain(e)){e.preventDefault();go(hashFor(c.key))}});
      row.appendChild(tg);row.appendChild(a);li.appendChild(row);
      if(hasSub){
        var sub=el('ul');
        if(c.notes.length){
          sub.className='secs';
          c.notes.forEach(function(n){
            var sl=el('li'),sa=el('a','nl sl');sa.href='#n.'+n.id;linkByNote[n.id]=sa;
            if(n.sec)sa.appendChild(el('span','nn',n.sec));
            sa.appendChild(el('span','nt',n.title.replace(/\s+-\s+.*$/,'')));
            sa.addEventListener('click',function(e){if(plain(e)){e.preventDefault();go('n.'+n.id)}});
            sl.appendChild(sa);sub.appendChild(sl);
          });

    });
  }
  buildTree(rootNode,$('tree'));
  function openLi(li){
    li.classList.remove('collapsed');

  /* ---------- drawer (phones) ---------- */
  function openDrawer(){$('side').classList.add('open');$('scrim').hidden=false;$('menu').setAttribute('aria-expanded','true')}
  function closeDrawer(){$('side').classList.remove('open');$('scrim').hidden=true;$('menu').setAttribute('aria-expanded','false')}

  /* ---------- building blocks ---------- */
  function fmtDate(d){
    try{var x=new Date(d+'T00:00:00');if(isNaN(x))return d;return x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}
  }
  function link(text,h,cls){
    var a=el('a',cls||null,text);a.href='#'+h;
    a.addEventListener('click',function(e){if(plain(e)){e.preventDefault();go(h)}});
    return a;
  }
  function crumbs(node,tail){
    var c=el('nav','crumbs');c.setAttribute('aria-label','Breadcrumb');

  function folderItem(c){
    var a=el('a','item'+(c.num?'':' nonum'));a.href='#'+hashFor(c.key);
    if(c.num)a.appendChild(el('span','no',c.num));

    var bits=[];
    if(c.children.length)bits.push(plural(c.children.length,c.depth===1?'chapter':'folder'));
    bits.push(c.count?plural(c.count,c.depth>=2?'section':'note'):'planned');
    b.appendChild(el('span','m',bits.join(' · ')));
    if(c.depth===2&&c.notes.length&&!c.children.length){
      b.appendChild(el('span','s',c.notes.map(function(n){return n.title.replace(/\s+-\s+.*$/,'')}).join(' · ')));
    }
    a.appendChild(b);
    a.addEventListener('click',function(e){if(plain(e)){e.preventDefault();go(hashFor(c.key))}});
    return a;
  }
  function noteItem(n,here,showPath){
    var numd=here&&n.sec;
    var a=el('a','item note'+(numd?' numd':''));a.href='#n.'+n.id;
    if(numd)a.appendChild(el('span','no',n.sec));

    tb.appendChild(el('span','t',n.title));

  /* ---------- topic graph ----------
     Drawn from the prereq / related / links fields that build.py already writes: nothing new to
     author. Cytoscape.js and cytoscape-dagre load from vendor/cytoscape/ on first use with plain
     <script> tags (allowed on file://, unlike fetch). Three views:
       #map, #map.<id>   whole notebook, force layout, filters by part and link kind
       note panel        prerequisite chain (layered, implied links removed) and neighbours (1-2 steps)
     Reading guides (HUB) link to almost every section, so they are left out unless asked for.
     Colours are the --part-NN and theme tokens, read again on every theme change. No animation. */
  var HUB=/^reading-order-/;
  function isHub(n){return HUB.test(n.id)}
  function shortTitle(n){return n.title.replace(/\s+-\s+.*$/,'')}
  function partOf(node){var x=node;while(x&&x.parent&&x.parent.key)x=x.parent;return x}
  function partNum(p){var m=/^(\d+)_/.exec((p&&p.seg)||'');return m?m[1]:'xx'}
  function tok(name){return getComputedStyle(root).getPropertyValue(name).trim()}
  var coarse=false;try{coarse=window.matchMedia('(pointer: coarse)').matches}catch(e){}

  /* one record per connected pair: pre=[from,to] when one is a prerequisite of the other */
  var PAIRS=null,PAIRS_OF={};
  function pairs(){
    if(PAIRS)return PAIRS;
    var m={};
    function get(a,b){var k=a<b?a+'|'+b:b+'|'+a;return m[k]||(m[k]={a:a,b:b,pre:null,rel:false,lnk:false})}
    notes.forEach(function(n){
      n.prereq.forEach(function(r){if(noteById[r]&&r!==n.id)get(r,n.id).pre=[r,n.id]});
      n.related.forEach(function(r){if(noteById[r]&&r!==n.id)get(r,n.id).rel=true});
      n.links.forEach(function(r){if(noteById[r]&&r!==n.id)get(r,n.id).lnk=true});
    });
    PAIRS=Object.keys(m).map(function(k){return m[k]});
    PAIRS.forEach(function(p){push(PAIRS_OF,p.a,p);push(PAIRS_OF,p.b,p)});
    return PAIRS;
  }
  /* the edge drawn for a pair: its strongest kind that is switched on */
  function edgeFor(p,show){
    var id='e:'+p.a+'|'+p.b;
    if(p.pre&&show.pre)return {group:'edges',data:{id:id,source:p.pre[0],target:p.pre[1]},classes:'pre'};
    if(p.rel&&show.rel)return {group:'edges',data:{id:id,source:p.a,target:p.b},classes:'rel'};
    if(p.lnk&&show.lnk)return {group:'edges',data:{id:id,source:p.a,target:p.b},classes:'lnk'};
    return null;
  }

  /* library loader */
  var cyState=0,cyWait=[];   /* 0 not loaded, 1 loading, 2 ready, 3 failed */
  function withCy(ok,fail){
    if(cyState===2){ok();return}
    if(cyState===3){fail();return}
    cyWait.push([ok,fail]);
    if(cyState===1)return;
    cyState=1;
    var files=['vendor/cytoscape/cytoscape.min.js','vendor/cytoscape/cytoscape-dagre.min.js'];
    function flush(k){var q=cyWait;cyWait=[];q.forEach(function(c){try{c[k]()}catch(e){if(window.console)console.error(e)}})}
    (function next(i){
      if(i===files.length){
        if(!window.cytoscape){cyState=3;flush(1);return}
        try{if(window.cytoscapeDagre)window.cytoscape.use(window.cytoscapeDagre)}catch(e){}
        cyState=2;flush(0);return;
      }
      var s=document.createElement('script');s.src=files[i];
      s.onload=function(){next(i+1)};
      s.onerror=function(){cyState=3;flush(1)};
      document.head.appendChild(s);
    })(0);
  }

  var live=[];   /* {cy, mode} for every graph on screen */
  function destroyGraphs(){live.forEach(function(g){try{g.cy.destroy()}catch(e){}});live=[]}
  function forget(cy){live=live.filter(function(g){if(g.cy===cy){try{cy.destroy()}catch(e){}return false}return true})}
  function restyleGraphs(){live.forEach(function(g){try{g.cy.style(sheet(g.mode))}catch(e){}})}

  function sheet(mode){
    var C={fg:tok('--fg'),muted:tok('--muted'),line:tok('--line'),surf:tok('--surface'),acc:tok('--accent'),ink:tok('--accent-ink'),wash:tok('--accent-wash')};
    var P={};
    function hue(e){var k=e.data('part');if(!(k in P))P[k]=tok('--part-'+k)||C.muted;return P[k]}
    var font='"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif';
    var s=[
      {selector:'node',style:{'background-color':hue,'border-width':1.5,'border-color':C.surf,'width':'data(sz)','height':'data(sz)',
        'label':'data(label)','color':C.fg,'font-family':font,'font-weight':500,'font-size':'data(fs)','text-wrap':'wrap','text-max-width':'data(tw)',
        'text-valign':'bottom','text-margin-y':3,'text-outline-color':C.surf,'text-outline-width':2,'min-zoomed-font-size':7}},
      {selector:'edge',style:{'width':1,'line-color':C.muted,'opacity':.5,'curve-style':'straight'}},
      {selector:'edge.pre',style:{'width':1.4,'opacity':.7,'target-arrow-shape':'triangle','target-arrow-color':C.muted,'arrow-scale':.8}},
      {selector:'edge.rel',style:{'line-style':'dashed','line-dash-pattern':[5,4]}},
      {selector:'edge.lnk',style:{'line-style':'dotted','opacity':.4}},
      {selector:'node.cur',style:{'border-color':C.acc,'border-width':4,'font-weight':600}},
      {selector:'node.planned',style:{'background-color':C.surf,'border-color':C.muted,'border-style':'dashed','border-width':1.5,'color':C.muted}}
    ];
    if(mode==='chain'){
      s.push({selector:'node',style:{'shape':'round-rectangle','width':'data(w)','height':'data(h)','background-color':C.surf,
        'border-color':hue,'border-width':2,'text-valign':'center','text-halign':'center','text-margin-y':0,'text-outline-width':0,'font-size':11}});
      s.push({selector:'node.cur',style:{'background-color':C.wash,'border-color':C.acc,'border-width':3,'font-weight':600}});
      s.push({selector:'node.planned',style:{'border-color':C.muted,'border-style':'dashed','border-width':1.5,'color':C.muted}});
      s.push({selector:'edge',style:{'curve-style':'bezier','opacity':.8}});
    }
    if(mode==='map'){
      s.push({selector:'node',style:{'min-zoomed-font-size':11,'text-outline-width':0,'text-background-color':C.surf,'text-background-opacity':.78,'text-background-padding':1}});
      s.push({selector:'node[fs >= 20]',style:{'z-index':8}});
      s.push({selector:'node.hl,node.sel',style:{'min-zoomed-font-size':0,'font-size':'data(hfs)','z-index':9}});
      s.push({selector:'node.faded',style:{'text-opacity':0}});
    }
    s.push({selector:'.faded',style:{'opacity':.12}});
    s.push({selector:'edge.hl',style:{'line-color':C.ink,'target-arrow-color':C.ink,'opacity':1,'width':2}});
    s.push({selector:'node.hl',style:{'border-color':C.fg}});
    s.push({selector:'node.sel',style:{'border-color':C.acc,'border-width':4,'font-weight':600,'z-index':10}});
    return s;
  }

  function makeCy(host,mode,els,interactive){
    host.innerHTML='';
    var cy=window.cytoscape({container:host,elements:els,style:sheet(mode),layout:{name:'preset'},
      minZoom:.1,maxZoom:3,boxSelectionEnabled:false,autoungrabify:true,autounselectify:true,
      userZoomingEnabled:!!interactive,userPanningEnabled:!!interactive||!coarse});
    /* hovering a node shows its label at a readable size whatever the zoom */
    cy.on('mouseover','node',function(e){
      var x=e.target;if(!x.hasClass('planned'))host.style.cursor='pointer';
      if(mode!=='chain')x.style({'font-size':Math.max(x.data('fs'),13/cy.zoom()),'min-zoomed-font-size':0,'z-index':20,'text-max-width':Math.max(x.data('tw'),160/cy.zoom())});
    });
    cy.on('mouseout','node',function(e){host.style.cursor='';if(mode!=='chain')e.target.removeStyle('font-size min-zoomed-font-size z-index text-max-width')});
    live.push({cy:cy,mode:mode});
    return cy;
  }
  function msg(host,text){host.innerHTML='';host.appendChild(el('div','gmsg',text))}
  var NOLIB='The graph library was not found. It should be at vendor/cytoscape/ next to index.html.';
  /* fit, but not so far out that labels become unreadable; then keep the focus node in view */
  function fitView(cy,focus,minZ,bottom){
    cy.fit(undefined,24);
    if(cy.zoom()>1.4){cy.zoom(1.4);cy.center()}
    if(cy.zoom()<minZ&&focus&&focus.length){

  /* prerequisite chain: every note reachable through prerequisites, with implied edges removed
     (u→v is dropped when v can already be reached from u through another prerequisite) */
  function chainOf(n){
    var seen={},stack=[n.id],edges={},planned={};
    seen[n.id]=1;
    while(stack.length){
      var x=noteById[stack.pop()];
      x.prereq.forEach(function(r){
        if(r===x.id)return;
        if(noteById[r]){edges[r+'\u0001'+x.id]=[r,x.id];if(!seen[r]){seen[r]=1;stack.push(r)}}
        else{planned[r]=1;edges['planned:'+r+'\u0001'+x.id]=['planned:'+r,x.id]}
      });
    }
    var all=Object.keys(edges).map(function(k){return edges[k]}),succ={};
    all.forEach(function(e){push(succ,e[0],e[1])});
    var kept=all.filter(function(e){
      var u=e[0],v=e[1],st=(succ[u]||[]).filter(function(w){return w!==v}),vis={};
      while(st.length){var w=st.pop();if(w===v)return false;if(vis[w])continue;vis[w]=1;(succ[w]||[]).forEach(function(y){st.push(y)})}
      return true;
    });
    var before=Object.keys(seen).filter(function(id){return id!==n.id}).map(function(id){return noteById[id]}).sort(function(a,b){return a.seq-b.seq});
    return {ids:Object.keys(seen),planned:Object.keys(planned),edges:kept,hidden:all.length-kept.length,before:before};
  }
  function chainElements(n,ch){
    var els=[];
    function box(id,label,cls,part){
      var tw=150,lines=0;
      label.split(/\n/).forEach(function(t){lines+=Math.max(1,Math.ceil(t.length/23))});
      els.push({group:'nodes',data:{id:id,label:label,part:part,w:tw+14,h:14*lines+18,tw:tw,sz:16,fs:11},classes:cls});
    }
    ch.ids.forEach(function(id){
      var x=noteById[id];
      box(id,(x.sec?x.sec+'  ':'')+shortTitle(x),id===n.id?'cur':'',partNum(partOf(x.node)));
    });
    ch.planned.forEach(function(t){box('planned:'+t,t+'\n(planned)','planned','xx')});
    ch.edges.forEach(function(e){els.push({group:'edges',data:{id:'c:'+e[0]+'|'+e[1],source:e[0],target:e[1]},classes:'pre'})});
    return els;
  }
  /* neighbours within `depth` steps over any link kind, placed by hand on rings round the section
     (alternating between rings when there are many, so labels do not collide; second-step sections sit
     next to the neighbour they come through). Edges between two outermost sections are left out. */
  function nearElements(n,depth){
    pairs();
    var dist={},par={},q=[n.id];dist[n.id]=0;
    while(q.length){
      var x=q.shift();if(dist[x]>=depth)continue;
      (PAIRS_OF[x]||[]).forEach(function(p){
        var y=p.a===x?p.b:p.a;
        if(dist[y]!=null||(isHub(noteById[y])&&y!==n.id))return;
        dist[y]=dist[x]+1;par[y]=x;q.push(y);
      });
    }
    var bySeq=function(a,b){return noteById[a].seq-noteById[b].seq};
    var ids=Object.keys(dist),at=[[],[],[]];
    ids.forEach(function(id){at[dist[id]].push(id)});
    at[1].sort(bySeq);
    var pos={},ang={},TAU=2*Math.PI,a0=-Math.PI/2;
    pos[n.id]={x:0,y:0};
    var n1=at[1].length,k1=Math.max(1,Math.min(3,Math.ceil(n1/12))),G=62;
    var R1=Math.max(115,105*n1/(TAU*k1));
    at[1].forEach(function(id,i){var a=a0+TAU*i/Math.max(1,n1);ang[id]=a;pos[id]={x:(R1+(i%k1)*G)*Math.cos(a),y:(R1+(i%k1)*G)*Math.sin(a)}});
    if(at[2].length){
      at[2].sort(function(a,b){return ang[par[a]]-ang[par[b]]||bySeq(a,b)});
      var n2=at[2].length,k2=Math.max(1,Math.min(4,Math.ceil(n2/18)));
      var R2=Math.max(R1+(k1-1)*G+120,90*n2/(TAU*k2));
      at[2].forEach(function(id,i){var a=a0+TAU*i/n2;pos[id]={x:(R2+(i%k2)*52)*Math.cos(a),y:(R2+(i%k2)*52)*Math.sin(a)}});
    }
    var els=ids.map(function(id){
      var d=dist[id];
      return {group:'nodes',position:pos[id],
        data:nodeData(noteById[id],{d:d,sz:d===0?26:(d===1?16:11),fs:d===0?13:(d===1?11:9),tw:d===0?150:(d===1?100:84)}),classes:d===0?'cur':''};
    });
    var show={pre:true,rel:true,lnk:true},ne=0;
    ids.forEach(function(id){
      (PAIRS_OF[id]||[]).forEach(function(p){
        if(p.a!==id||dist[p.b]==null)return;
        if(dist[p.a]===depth&&dist[p.b]===depth)return;
        var e=edgeFor(p,show);if(e){els.push(e);ne++}
      });
    });
    return {els:els,count:ids.length-1,big:n1>16||at[2].length>30,edges:ne};
  }

    function render(focusNote){
      if(cy){forget(cy);cy=null}

      });

      var edges=[],deg={};
      PAIRS.forEach(function(p){
        if(!inVis[p.a]||!inVis[p.b])return;
        var e=edgeFor(p,show);if(!e)return;
        edges.push(e);deg[p.a]=(deg[p.a]||0)+1;deg[p.b]=(deg[p.b]||0)+1;
      });

      vis.forEach(function(n){var k=partNum(partOf(n.node));if(!byPart[k]){byPart[k]=[];order.push(k)}byPart[k].push(n)});
      var els=[];

          var g=deg[n.id]||0;

        });
        a0+=sector;
      });

      sub.textContent=plural(vis.length,'section')+' · '+plural(edges.length,'link')+' shown';
      if(!vis.length){msg(host,'Every part is switched off. Select a part above, or All.');hint(' ');return}

          nodeRepulsion:function(){return 40000},idealEdgeLength:function(){return 80},edgeElasticity:function(){return 60},
          nodeOverlap:12,gravity:.25,numIter:1000,componentSpacing:80,padding:30}).run();
        var kept=[];
        cy.nodes().filter(function(x){return big[x.id()]}).sort(function(a,b){return b.degree()-a.degree()}).forEach(function(x){
          var bb=x.boundingBox({includeLabels:true}),hit=kept.some(function(k){return !(bb.x2<k.x1-8||bb.x1>k.x2+8||bb.y2<k.y1-8||bb.y1>k.y2+8)});
          if(hit||kept.length>=14)x.data({fs:10,hfs:11,tw:130});else kept.push(bb);

      if(!hit)reading.some(function(n){var t=((n.sec||'')+' '+n.title).toLowerCase();if(words.every(function(w){return t.indexOf(w)>=0})){hit=n;return true}return false});
      if(!hit){hint('No section title matches “'+find.value+'”.');return}
      var x=cy.getElementById(hit.id);

      var b=(linked&&see)?link(c.label,'n.'+see.id,'conv'):el('span','conv',c.label);
      b.title=(ax.about||c.axis)+(see&&linked?' · see '+see.title:'');
      p.appendChild(b);
    });
    return p;
  }

  /* ---------- hover previews ----------
     Pointing at (or tabbing to) a link to a section shows its number, title, summary, conventions
     and key equation; a link to an equation shows the equation itself. Not on touch screens. */
  var pop=el('div','pop');pop.id='pop';pop.setAttribute('role','tooltip');pop.hidden=true;
  document.body.appendChild(pop);
  var popTimer=null,popFor=null;
  function hidePop(){clearTimeout(popTimer);popTimer=null;if(popFor){popFor.removeAttribute('aria-describedby')}popFor=null;pop.hidden=true}
  function popTarget(a){
    var h=(a.getAttribute('href')||'').slice(1),r=resolve(h);
    if(r.kind!=='note')return null;
    var eq=r.anchor&&r.anchor.indexOf('eq-')===0?r.anchor.slice(3):'';
    return {n:r.note,eq:eq&&r.note.eqIndex[eq]!=null?eq:''};
  }
  function fillPop(t){
    var n=t.n;pop.innerHTML='';
    pop.appendChild(el('p','eyebrow',(n.sec?'Section '+n.sec+' · ':'')+n.node.label));
    pop.appendChild(el('p','t',n.title));
    var tex='',num='';
    if(t.eq){tex=eqTex(n,t.eq);num=eqNum(n,t.eq)}
    else{
      if(n.summary)pop.appendChild(el('p','s',n.summary));
      var key=n.key||'';
      if(key){tex=eqTex(n,key);num=eqNum(n,key)}
    }
    if(tex){var d=el('div','eq');d.textContent='$$'+tex+(num&&num!=='?'?'\\tag{'+num+'}':'')+'$$';pop.appendChild(d)}
    var cl=convLine(n.conv,false);if(cl)pop.appendChild(cl);
    var bits=[];if(n.kind)bits.push(kindName(n.kind));if(n.status)bits.push(STATUS[n.status]||n.status);bits.push(n.mins+' min read');
    pop.appendChild(el('p','m',bits.join(' · ')));
  }
  function placePop(a){
    var r=a.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight;
    pop.style.left='0px';pop.style.top='0px';pop.style.visibility='hidden';pop.hidden=false;
    var w=pop.offsetWidth,h=pop.offsetHeight;
    var top=r.bottom+8;if(top+h>H-8&&r.top-8-h>8)top=r.top-8-h;
    var left=Math.max(8,Math.min(r.left,W-w-8));
    pop.style.left=left+'px';pop.style.top=Math.max(8,top)+'px';pop.style.visibility='';
  }
  function showPop(a){
    var t=popTarget(a);if(!t){hidePop();return}
    popFor=a;a.setAttribute('aria-describedby','pop');
    fillPop(t);placePop(a);
    typeset(pop,function(){
      if(popFor!==a||pop.hidden)return;
      /* shrink a wide equation to the width of the card rather than clipping it */
      var d=pop.querySelector('.eq'),c=d&&d.querySelector('mjx-container');
      if(c){c.style.fontSize='';if(c.scrollWidth>d.clientWidth+1)c.style.fontSize=Math.max(50,Math.floor(100*d.clientWidth/c.scrollWidth))+'%'}
      placePop(a);
    });
  }
  function popCandidate(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#n."]');return a&&!pop.contains(a)?a:null}
  if(!coarse){
    document.addEventListener('mouseover',function(e){
      var a=popCandidate(e);if(!a||a===popFor)return;
      clearTimeout(popTimer);popTimer=setTimeout(function(){showPop(a)},350);
    });
    document.addEventListener('mouseout',function(e){
      var a=popCandidate(e);if(!a)return;
      if(e.relatedTarget&&a.contains(e.relatedTarget))return;
      clearTimeout(popTimer);popTimer=setTimeout(hidePop,120);
    });
    document.addEventListener('focusin',function(e){var a=popCandidate(e);if(a){clearTimeout(popTimer);showPop(a)}});
    document.addEventListener('focusout',function(e){if(popCandidate(e))hidePop()});
    window.addEventListener('scroll',function(){if(!pop.hidden)hidePop()},{passive:true});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')hidePop()});
  }

  /* ---------- sources page (#sources) ----------
     Built from each note's "## Source" section: books (italic title followed by "(edition, year)") with
     the sections cited, and papers by DOI. */
  function noteRef(id){
    var n=noteById[id];if(!n)return null;
    return link((n.sec?n.sec+' ':'')+shortTitle(n),'n.'+n.id,'nref');
  }
  function refList(ids){
    var w=el('span','nrefs');
    ids.forEach(function(id,i){var a=noteRef(id);if(!a)return;if(w.children.length)w.appendChild(document.createTextNode(' · '));w.appendChild(a)});
    return w;
  }
  function drawSources(v){
    var S=DATA.sources||{books:[],papers:[]};
    var c=crumbs(rootNode,true);
    c.appendChild(el('span','sep','/'));c.appendChild(el('span',null,'Sources'));
    v.appendChild(c);
    var head=el('header','head');
    head.appendChild(el('h1',null,'Sources'));
    head.appendChild(el('p','lede','The books and papers the sections draw on, collected from the Source paragraph of each section. Open a book to see which of its sections are used where.'));
    var citing={};S.books.forEach(function(b){b.notes.forEach(function(id){citing[id]=1})});S.papers.forEach(function(p){p.notes.forEach(function(id){citing[id]=1})});
    head.appendChild(el('p','sub',plural(S.books.length,'book')+' · '+plural(S.papers.length,'paper')+' with a DOI · cited in '+plural(Object.keys(citing).length,'section')));
    v.appendChild(head);

    if(S.books.length){
      var g=el('section','group');g.appendChild(el('h2',null,'Books'));
      S.books.forEach(function(b){
        var d=el('details','src');
        var sm=el('summary');
        var t=el('span','t');t.appendChild(el('i',null,b.title));sm.appendChild(t);
        sm.appendChild(el('span','m',[b.authors,b.edition.replace(/^\(|\)$/g,''),plural(b.notes.length,'section')].filter(Boolean).join(' · ')));
        d.appendChild(sm);
        var ul=el('ul','locs');
        b.locs.forEach(function(x){
          var l=el('li');l.appendChild(el('span','loc',x[0]));l.appendChild(refList(x[1]));ul.appendChild(l);
        });
        if(b.general.length){var l=el('li');l.appendChild(el('span','loc','other'));l.title='Problems, figures or the book as a whole, with no section number';l.appendChild(refList(b.general));ul.appendChild(l)}
        d.appendChild(ul);
        g.appendChild(d);
      });
      v.appendChild(g);
    }
    if(S.papers.length){
      var pg=el('section','group');pg.appendChild(el('h2',null,'Papers'));
      var ul=el('ul','papers');
      S.papers.forEach(function(p){
        var l=el('li');
        var t=el('p','cit');t.innerHTML=p.label;l.appendChild(t);
        var m=el('p','m');
        var a=el('a',null,'doi:'+p.doi);a.href='https://doi.org/'+p.doi;a.target='_blank';a.rel='noopener';m.appendChild(a);
        if(p.note){m.appendChild(document.createTextNode(' · '));m.appendChild(link('notes on this paper','n.'+p.note,'nref'))}
        l.appendChild(m);
        if(p.notes.length){var r=el('p','m');r.appendChild(document.createTextNode('Cited in '));r.appendChild(refList(p.notes));l.appendChild(r)}
        ul.appendChild(l);
      });
      pg.appendChild(ul);v.appendChild(pg);
    }
    if(!S.books.length&&!S.papers.length)v.appendChild(el('p','none-found','No Source sections found.'));
  }

  /* ---------- kind index and search ---------- */
  function drawKind(k,v){
    var c=crumbs(rootNode,true);
    c.appendChild(el('span','sep','/'));c.appendChild(el('span',null,kindsName(k)));
    v.appendChild(c);
    var head=el('header','head');
    head.appendChild(el('h1',null,kindsName(k)));
    head.appendChild(el('p','sub',plural(byKind[k].length,'note')));
    v.appendChild(head);
    v.appendChild(group('Notes',byKind[k].slice().sort(byOrder).map(function(n){return noteItem(n,null,true)})));
  }
  function drawResults(q,v){
    var words=q.toLowerCase().split(/\s+/);
    var fold=allNodes.filter(function(c){
      var hay=(c.full+' '+pathLabel(c)).toLowerCase();
      return words.every(function(w){return hay.indexOf(w)>=0});
    });
    var hits=notes.filter(function(n){
      var hay=(n.title+' '+n.summary+' '+n.tags.join(' ')+' '+(n.kind||'')+' '+textOf(n)).toLowerCase();
      return words.every(function(w){return hay.indexOf(w)>=0});
    });
    var head=el('header','head');head.style.marginTop='24px';
    head.appendChild(el('h1',null,'Search'));
    head.appendChild(el('p','sub',plural(fold.length,'folder')+' · '+plural(hits.length,'note')+' for “'+q+'”'));
    v.appendChild(head);
    if(fold.length){
      v.appendChild(group('Folders',fold.slice(0,30).map(function(c){
        var a=folderItem(c);
        var m=a.querySelector('.m');
        if(!m){m=el('span','m');a.lastChild.appendChild(m)}
        var up=c.parent&&c.parent.key?pathLabel(c.parent):'';
        m.textContent=[up,m.textContent].filter(Boolean).join(' · ');
        return a;
      })));
    }
    if(hits.length)v.appendChild(group('Notes',hits.map(function(n){return noteItem(n,null,true)})));
    if(!fold.length&&!hits.length)v.appendChild(el('p','none-found','Nothing matches that search. Try a shorter word.'));
  }

  function draw(){
    destroyGraphs();
    var v=$('view');v.innerHTML='';
    if(state.q){drawResults(state.q,v);return}
    var r=resolve(state.h);
    if(r.kind==='note')drawNote(r.note,v);
    else if(r.kind==='kind')drawKind(r.k,v);
    else if(r.kind==='map')drawMap(r.focus,v);
    else if(r.kind==='sources')drawSources(v);
    else drawFolder(r.node,v);
  }
  $('q').addEventListener('input',function(e){state.q=e.target.value.trim();draw()});
  $('q').addEventListener('keydown',function(e){if(e.key==='Escape'&&$('q').value){$('q').value='';state.q='';draw()}});
  /* links written inside notes, like [[other note]] */
  $('view').addEventListener('click',function(e){
    if(e.defaultPrevented||!plain(e))return;
    var a=e.target.closest&&e.target.closest('a[href^="#n."]');
    if(!a)return;
    e.preventDefault();
    var h=a.getAttribute('href').slice(1),r=resolve(h),cur=resolve(state.h);
    if(r.kind==='note'&&r.anchor&&cur.kind==='note'&&cur.note===r.note){
      state.h=h;try{location.hash=h}catch(x){}
      hidePop();jumpTo(r.anchor);return;
    }
    go(h);
  });

  /* ---------- theme ---------- */
  function isDark(){
    if(root.dataset.theme)return root.dataset.theme==='dark';
    return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function labelTheme(){$('theme').textContent=isDark()?'Light':'Dark'}
  try{var saved=localStorage.getItem('theory-notebook-theme');if(saved==='light'||saved==='dark')root.dataset.theme=saved}catch(e){}
  $('theme').addEventListener('click',function(){
    var next=isDark()?'light':'dark';
    root.dataset.theme=next;
    try{localStorage.setItem('theory-notebook-theme',next)}catch(e){}
    labelTheme();restyleGraphs();
  });
  labelTheme();
  try{
    var mqDark=window.matchMedia('(prefers-color-scheme: dark)');
    if(mqDark.addEventListener)mqDark.addEventListener('change',restyleGraphs);else if(mqDark.addListener)mqDark.addListener(restyleGraphs);
  }catch(e){}
  try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(restyleGraphs)}catch(e){}

  /* ---------- start ---------- */
  setRoute((location.hash||'').slice(1));
  window.scrollTo(0,0);
})();
</script>
</body></html>
